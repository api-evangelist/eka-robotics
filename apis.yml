name: Eka Robotics
description: >-
  Eka Robotics is a Cambridge, Massachusetts robotics-AI company founded in 2025
  that is building intelligence for the physical world in its native language:
  force. Its Vision-Force-Action (VFA) model combines vision, force sensing, and
  action to give robots generality, performance, and safety for close human-robot
  interaction. The team pioneers self-supervised robot learning, large-scale robot
  learning, world models, reinforcement learning, and sim-to-real transfer, drawing
  talent from MIT, Berkeley, Harvard, DeepMind, and Boston Dynamics. Co-founded by
  MIT professor Pulkit Agrawal (Improbable AI Lab), the company is an early-stage
  research-and-hardware venture and does not yet publish a public API, developer
  portal, SDK, or documentation. This profile was surfaced as a venture-portfolio
  lead and enriched with the company's public identity for the API Evangelist network.
